version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # release-plz decides on the packaged contents of the crate, not on the
  # prefix, so a prefix that reads true is enough here.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
