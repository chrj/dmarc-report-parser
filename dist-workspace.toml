[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Features to pass to cargo build
features = ["cli"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Which actions to run on pull requests
pr-run-mode = "plan"

# dist owns .github/workflows/release.yml. If the file differs from what dist
# generates, the release run stops.
# These pins hold the actions in that file at the versions the other workflows use.
[dist.github-action-commits]
"actions/checkout" = "v7"
"actions/upload-artifact" = "v7"
"actions/download-artifact" = "v8"
